<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>Forge</title>
<style>
:root{--bg:#08080a;--panel:rgba(22,22,28,.72);--border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.14);--fg:#f2f2f7;--dim:#8b8b9e;--dim-2:#5a5a6e;--a2:#22d3ee;--ok:#34d399;--err:#f87171;--grad:linear-gradient(135deg,#8b5cf6 0%,#22d3ee 100%);--grad-soft:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,211,238,.14));--shadow:0 12px 40px -8px rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;letter-spacing:-.01em}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bg::before,#bg::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
#bg::before{width:560px;height:560px;background:radial-gradient(circle,#8b5cf6,transparent 70%);top:-200px;left:-160px;animation:fl1 22s ease-in-out infinite}
#bg::after{width:520px;height:520px;background:radial-gradient(circle,#22d3ee,transparent 70%);bottom:-200px;right:-160px;animation:fl2 26s ease-in-out infinite}
@keyframes fl1{50%{transform:translate(120px,80px) scale(1.1)}}
@keyframes fl2{50%{transform:translate(-100px,-60px) scale(1.08)}}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);background:rgba(10,10,14,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.dot{width:20px;height:20px;border-radius:7px;background:var(--grad);box-shadow:0 0 18px rgba(139,92,246,.6)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--dim);max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.on{color:var(--ok);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.pill .led{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;flex:0 0 auto}
.ibtn{height:34px;min-width:34px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--fg);font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
.ibtn:active{background:rgba(255,255,255,.12)}
.ibtn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 20px -6px rgba(139,92,246,.7)}
.ibtn:disabled{opacity:.4}
.tabs{display:none;gap:4px;background:rgba(255,255,255,.04);padding:3px;border-radius:10px;border:1px solid var(--border)}
.tab{padding:5px 12px;border-radius:7px;font-size:12.5px;color:var(--dim);cursor:pointer;border:0;background:transparent;font:inherit;touch-action:manipulation}
.tab.on{background:rgba(255,255,255,.08);color:var(--fg)}
main{flex:1;display:grid;grid-template-columns:420px 1fr;min-height:0}
@media (max-width:900px){main{grid-template-columns:1fr}.tabs{display:flex}.brand span{display:none}main.show-preview .chat{display:none}main:not(.show-preview) .preview{display:none}}
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:rgba(8,8,11,.4)}
.log{flex:1;overflow-y:auto;padding:18px 14px 8px;-webkit-overflow-scrolling:touch}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
.msg{margin-bottom:16px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.msg .who{font-size:10px;color:var(--dim-2);margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
.msg.user{text-align:right}
.msg.user .who{text-align:right}
.msg.user .body{display:inline-block;text-align:left;max-width:88%;padding:10px 14px;border-radius:16px 16px 4px 16px;background:var(--grad);color:#fff;font-size:13.5px;line-height:1.5;box-shadow:0 6px 22px -8px rgba(139,92,246,.6);white-space:pre-wrap;word-break:break-word}
.msg.assistant .body{display:block;padding:11px 14px;border-radius:16px 16px 16px 4px;background:var(--panel);border:1px solid var(--border);font-size:13px;line-height:1.5;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:pre-wrap;word-break:break-word}
.msg.assistant .body.err{border-color:rgba(248,113,113,.35);background:rgba(40,15,15,.6);color:#ffc4c4}
.msg img.thumb{max-width:200px;max-height:200px;border-radius:10px;display:block;margin:6px 0 0 auto}
.msg pre{background:#0a0a0f;border:1px solid var(--border);border-radius:8px;padding:10px;margin:8px 0 0;overflow-x:auto;font-size:11.5px;line-height:1.5;white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-height:220px}
.bundle{margin-top:10px;border-radius:12px;background:linear-gradient(135deg,rgba(139,92,246,.14),rgba(34,211,238,.1));border:1px solid rgba(139,92,246,.35);padding:12px 14px}
.bundle .h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:6px}
.bundle .h .ic{width:22px;height:22px;border-radius:7px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:12px}
.bundle .list{font-size:11.5px;color:var(--dim);line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-height:140px;overflow-y:auto;margin-bottom:10px;white-space:pre-wrap;word-break:break-all}
.bundle .acts{display:flex;gap:6px;flex-wrap:wrap}
.bundle .acts button{font-size:12px;padding:7px 12px;border-radius:9px;background:var(--grad);border:0;color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.bundle .acts button.ghost{background:rgba(255,255,255,.06);color:var(--fg);border:1px solid var(--border)}
.building{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px 16px 16px 4px;background:var(--panel);border:1px solid var(--border);overflow:hidden;position:relative}
.building::after{content:"";position:absolute;inset:0;background:var(--grad-soft);background-size:200% 100%;animation:shim 2.4s linear infinite;pointer-events:none}
@keyframes shim{0%{background-position:-200% 0}100%{background-position:200% 0}}
.spin{width:16px;height:16px;border-radius:50%;flex:0 0 auto;border:2px solid rgba(255,255,255,.12);border-top-color:var(--a2);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:32px 22px;text-align:center;color:var(--dim)}
.empty .orb{width:70px;height:70px;margin:0 auto 18px;border-radius:24px;background:var(--grad);box-shadow:0 12px 40px -8px rgba(139,92,246,.7);display:flex;align-items:center;justify-content:center;font-size:30px}
.empty h2{margin:0 0 6px;font-size:17px;color:var(--fg);font-weight:600}
.empty p{margin:0 0 20px;font-size:13px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--dim);cursor:pointer;font:inherit;touch-action:manipulation}
.chip:active{background:rgba(255,255,255,.1)}
.composer{flex:0 0 auto;padding:10px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:rgba(10,10,14,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.attached{display:none;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.attached.on{display:flex}
.attached .a{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.attached .a img{width:100%;height:100%;object-fit:cover}
.attached .a button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#2a2a35;border:1px solid var(--border-2);color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.field{display:flex;gap:8px;align-items:flex-end;padding:6px 6px 6px 12px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--border)}
.field:focus-within{border-color:rgba(139,92,246,.55);box-shadow:0 0 0 3px rgba(139,92,246,.12)}
.attachbtn{flex:0 0 auto;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.attachbtn:active{background:rgba(255,255,255,.1)}
.attachbtn svg{width:18px;height:18px}
textarea{flex:1;resize:none;border:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;line-height:1.5;padding:9px 0;outline:none;min-height:22px;max-height:140px}
textarea::placeholder{color:var(--dim-2)}
.send{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:0;background:var(--grad);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -6px rgba(139,92,246,.8);touch-action:manipulation}
.send:active{filter:brightness(1.1)}
.send:disabled{opacity:.35}
.send svg{width:17px;height:17px}
.preview{display:flex;flex-direction:column;min-height:0;background:rgba(5,5,8,.6)}
.pbar{flex:0 0 auto;height:48px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--border);background:rgba(10,10,14,.5)}
.url{flex:1;min-width:0;height:30px;padding:0 12px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--border);display:flex;align-items:center;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url .lock{color:var(--ok);margin-right:6px}
.stage{flex:1;position:relative;min-height:0;background:#fff}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.blank{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6b6b78;background:#0c0c10;text-align:center;padding:24px;gap:10px}
.blank .icon{width:56px;height:56px;border-radius:18px;background:var(--grad-soft);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:6px}
.blank p{font-size:13px;margin:0;max-width:280px;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.card{width:min(520px,100%);background:#12121a;border:1px solid var(--border-2);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}
.card p{margin:0 0 14px;font-size:12.5px;color:var(--dim);line-height:1.5}
.card a{color:var(--a2);text-decoration:none}
.card input{width:100%;padding:11px 13px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--fg);font:inherit;font-size:14px;outline:none;margin-bottom:14px}
.card input:focus{border-color:rgba(139,92,246,.5);box-shadow:0 0 0 3px rgba(139,92,246,.12)}
.row{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);padding:11px 18px;border-radius:12px;background:rgba(30,30,40,.95);border:1px solid var(--border-2);font-size:13px;color:var(--fg);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fatal{position:fixed;top:60px;left:12px;right:12px;background:#3a1414;border:1px solid #6a2020;color:#ffb8b8;padding:12px 14px;border-radius:12px;font-size:12.5px;z-index:70;display:none}
.fatal.on{display:block}
</style>
</head>
<body>
<div id="bg"></div>
<div class="fatal" id="fatal"></div>
<div id="app">
  <header>
    <div class="brand"><div class="dot"></div><span>Forge</span></div>
    <div class="tabs" id="tabs">
      <button class="tab on" type="button" data-tab="chat">Chat</button>
      <button class="tab" type="button" data-tab="preview">Preview</button>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="status"><span class="led"></span><span id="statusText">tap key</span></span>
    <button class="ibtn" id="btnKey" type="button">Key</button>
    <button class="ibtn" id="btnNew" type="button">New</button>
  </header>
  <main id="main">
    <section class="chat">
      <div class="log" id="log"></div>
      <div class="composer">
        <div class="attached" id="attached"></div>
        <div class="field">
          <label class="attachbtn" for="file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l8.57-8.57A4 4 0 1118 6.6l-8.57 8.57a2 2 0 11-2.83-2.83l8.5-8.49"/></svg>
          </label>
          <input id="file" type="file" accept="image/*" style="display:none" multiple>
          <textarea id="input" placeholder="ask for anything — ships as a file…" rows="1" enterkeyhint="send"></textarea>
          <button class="send" id="send" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </section>
    <section class="preview">
      <div class="pbar">
        <div class="url"><span class="lock">◈</span><span id="urlText">forge.local</span></div>
        <button class="ibtn" id="btnOpen" type="button">Open</button>
        <button class="ibtn primary" id="btnDl" type="button">Download</button>
      </div>
      <div class="stage" id="stage">
        <div class="blank"><div class="icon">✦</div><p>Websites preview here. Everything else ships as a downloadable file.</p></div>
      </div>
    </section>
  </main>
</div>
<div class="modal" id="modal">
  <div class="card">
    <h3>OpenRouter API Key</h3>
    <p>Get one at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>.</p>
    <input type="password" id="keyInput" placeholder="sk-or-v1-…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row">
      <button class="ibtn" id="keyCancel" type="button">Cancel</button>
      <button class="ibtn primary" id="keySave" type="button">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

function fatal(msg){
  const f=document.getElementById("fatal");
  if(f){f.textContent="error: "+msg;f.classList.add("on");}
  try{console.error(msg);}catch(_){}
}

window.addEventListener("error",e=>{ fatal(e.message||"unknown"); });

try{

"- README.md with: what it does, exact build command, exact run command, one line anti-cheat context, driver-signing/VM notes as plain lines.",

].join("\n");

const state={key:"",code:"",bundle:null,chat:[],busy:false,images:[]};

function toast(msg,ms){
  const t=$("#toast");if(!t)return;
  t.textContent=msg;t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),ms||2200);
}
function status(text,on){
  const s=$("#statusText"),p=$("#status");
  if(!s||!p)return;
  s.textContent=text;
  p.classList.toggle("on",!!on);
}

/* ============ zip ============ */
let _ct=null;
function crc32(u8){
  if(!_ct){
    _ct=new Uint32Array(256);
    for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;_ct[n]=c>>>0;}
  }
  let c=0^(-1);
  for(let i=0;i<u8.length;i++)c=(c>>>8)^_ct[(c^u8[i])&0xFF];
  return (c^(-1))>>>0;
}
function enc(s){return new TextEncoder().encode(s);}
function dT(d){return ((d.getHours()&31)<<11)|((d.getMinutes()&63)<<5)|((d.getSeconds()/2)&31);}
function dD(d){return (((d.getFullYear()-1980)&127)<<9)|(((d.getMonth()+1)&15)<<5)|(d.getDate()&31);}
function makeZip(files){
  const now=new Date(),t=dT(now),dd=dD(now),chunks=[],central=[];
  let off=0;
  for(const f of files){
    const n=enc(f.path);
    const data=typeof f.content==="string"?enc(f.content):f.content;
    const crc=crc32(data);
    const L=new Uint8Array(30+n.length+data.length);
    const dv=new DataView(L.buffer);
    dv.setUint32(0,0x04034b50,true);
    dv.setUint16(4,20,true);
    dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true);
    dv.setUint16(10,t,true);
    dv.setUint16(12,dd,true);
    dv.setUint32(14,crc,true);
    dv.setUint32(18,data.length,true);
    dv.setUint32(22,data.length,true);
    dv.setUint16(26,n.length,true);
    dv.setUint16(28,0,true);
    L.set(n,30);
    L.set(data,30+n.length);
    chunks.push(L);

    const C=new Uint8Array(46+n.length);
    const cv=new DataView(C.buffer);
    cv.setUint32(0,0x02014b50,true);
    cv.setUint16(4,20,true);
    cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true);
    cv.setUint16(10,0,true);
    cv.setUint16(12,t,true);
    cv.setUint16(14,dd,true);
    cv.setUint32(16,crc,true);
    cv.setUint32(20,data.length,true);
    cv.setUint32(24,data.length,true);
    cv.setUint16(28,n.length,true);
    cv.setUint16(30,0,true);
    cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);
    cv.setUint16(36,0,true);
    cv.setUint32(38,0,true);
    cv.setUint32(42,off,true);
    C.set(n,46);
    central.push(C);
    off+=L.length;
  }
  const cdLen=central.reduce((a,b)=>a+b.length,0);
  const E=new Uint8Array(22);
  const ev=new DataView(E.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,files.length,true);
  ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdLen,true);
  ev.setUint32(16,off,true);
  const total=off+cdLen+22;
  const out=new Uint8Array(total);
  let p=0;
  for(const c of chunks){out.set(c,p);p+=c.length;}
  for(const c of central){out.set(c,p);p+=c.length;}
  out.set(E,p);
  return new Blob([out],{type:"application/zip"});
}

/* ============ bundle parser ============ */
function parseBundle(text){
  if(!text)return null;
  const re=/^FILE:\s*(.+?)\s*$/gm;
  const marks=[];
  let m;
  while((m=re.exec(text))!==null) marks.push({path:m[1].trim(),start:m.index,end:re.lastIndex});
  if(!marks.length)return null;
  const files=[];
  for(let i=0;i<marks.length;i++){
    const cur=marks[i];
    const end=(i+1<marks.length)?marks[i+1].start:text.length;
    let body=text.slice(cur.end,end);
    body=body.replace(/^\r?\n/,"");
    body=body.replace(/\r?\n```\s*$/,"");
    body=body.replace(/\r?\n$/,"");
    const p=cur.path.replace(/^[\/\.]+/,"").replace(/\.\.+/g,"");
    if(!p)continue;
    files.push({path:p,content:body});
  }
  return files.length?{files}:null;
}
function bundleWorthy(p){
  if(!p)return false;
  return /\b(cheat|menu|loader|dll|exe|tweak|ipa|apk|esp|aimbot|triggerbot|radar|trainer|save.?editor|memory.?editor|dumper|offset|decompiler|hook|injector|unpacker|packer|crypter|c2|bot|scanner|kernel|driver|payload|homebrew|mod.?menu|spoof|hwid|macro|autoclicker|project|cmake|makefile|gradle|theos|byovd|dma|hypervisor)\b/i.test(p);
}

/* ============ render ============ */
function renderInto(el,text){
  if(!text){el.textContent="";return;}
  const parts=String(text).split(/```/);
  for(let i=0;i<parts.length;i++){
    if(i%2===1){
      const nl=parts[i].indexOf("\n");
      const body=nl>=0?parts[i].slice(nl+1):parts[i];
      const pre=document.createElement("pre");
      pre.textContent=body.replace(/\n$/,"");
      el.appendChild(pre);
    } else {
      const sp=document.createElement("span");
      sp.textContent=parts[i];
      el.appendChild(sp);
    }
  }
}
function addMsg(role,text,err,imgs){
  const log=$("#log");if(!log)return null;
  const el=document.createElement("div");
  el.className="msg "+role;
  el.innerHTML='<div class="who">'+(role==="user"?"you":"forge")+'</div><div class="body'+(err?" err":"")+'"></div>';
  const b=el.querySelector(".body");
  if(role==="assistant")renderInto(b,text||"");
  else b.textContent=text||"";
  if(imgs&&imgs.length){
    for(const src of imgs){
      const im=document.createElement("img");
      im.className="thumb";im.src=src;
      b.appendChild(im);
    }
  }
  log.appendChild(el);
  log.scrollTop=log.scrollHeight;
  return el;
}
function addBundleCard(files){
  const log=$("#log");if(!log)return;
  const el=document.createElement("div");
  el.className="msg assistant";
  const name=files.length===1?files[0].path.split("/").pop():"forge-project.zip";
  el.innerHTML='<div class="who">forge</div><div class="body">done — '+files.length+' file'+(files.length===1?"":"s")+' ready.<div class="bundle"><div class="h"><div class="ic">◆</div>project bundle</div><div class="list"></div><div class="acts"><button class="dl" type="button">Download '+name+'</button><button class="ghost cp" type="button">Copy all</button></div></div></div>';
  const list=el.querySelector(".list");
  list.textContent=files.map(f=>f.path+"  ·  "+(f.content.length/1024).toFixed(1)+" KB").join("\n");
  el.querySelector(".dl").addEventListener("click",()=>downloadBundle());
  el.querySelector(".cp").addEventListener("click",()=>{
    const all=files.map(f=>"=== "+f.path+" ===\n"+f.content).join("\n\n");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(all).then(()=>toast("copied"),()=>toast("copy failed"));
    } else toast("clipboard unavailable");
  });
  log.appendChild(el);
  log.scrollTop=log.scrollHeight;
}
function addBuilding(){
  const log=$("#log");
  const el=document.createElement("div");
  el.className="msg assistant";
  el.innerHTML='<div class="who">forge</div><div class="building"><div class="spin"></div><div><div>Working…</div><div style="font-size:11.5px;color:var(--dim);margin-top:2px" id="bSub">waiting</div></div></div>';
  log.appendChild(el);
  log.scrollTop=log.scrollHeight;
  return el;
}
function showEmpty(){
  const log=$("#log");if(!log)return;
  log.innerHTML="";
  const w=document.createElement("div");
  w.className="empty";
  w.innerHTML='<div class="orb">✦</div><h2>Ask for anything</h2><p>Sites preview on the right. Projects ship as downloadable files.</p><div class="chips"></div>';
  const chips=[
    "cheat menu for cs2 — external c++, esp + aimbot + triggerbot, handle stripping, byovd, imgui overlay, cmake",
    "cs2 internal — manual mapped dll, byovd loader, silent aim, no recoil",
    "8 ball pool ios mod menu — theos tweak, unlimited guidelines + aim assist",
    "unity il2cpp offset dumper — c++ project, cmake, sig scanner",
    "fortnite esp — dma based, leechcore + overlay pc",
    "what can you do?",
  ];
  const cw=w.querySelector(".chips");
  for(const t of chips){
    const b=document.createElement("button");
    b.className="chip";b.type="button";
    b.textContent=t.length>40?t.slice(0,38)+"…":t;
    b.addEventListener("click",()=>{const i=$("#input");if(i){i.value=t;i.focus();}send();});
    cw.appendChild(b);
  }
  log.appendChild(w);
}
function setPreview(html){
  const stage=$("#stage"),u=$("#urlText");
  if(!stage)return;
  if(!html||html.length<60){
    stage.innerHTML='<div class="blank"><div class="icon">✦</div><p>Websites preview here. Everything else ships as a downloadable file.</p></div>';
    if(u)u.textContent="forge.local";
    return;
  }
  stage.innerHTML='<iframe sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>';
  stage.querySelector("iframe").srcdoc=html;
  if(u)u.textContent="forge.local / index.html";
}
function extractHTML(s){
  if(!s)return"";
  s=String(s).trim();
  s=s.replace(/^```[a-zA-Z]*\s*\n?/,"").replace(/\n?```\s*$/,"");
  const i=s.search(/<!doctype html>|<html[\s>]/i);
  if(i>0)s=s.slice(i);
  return s.trim();
}
function isSite(s){
  if(!s)return false;
  const t=String(s).trim();
  if(!/<!doctype html>|<html[\s>]/i.test(t))return false;
  if(!/<\/html>/i.test(t))return false;
  if(/^FILE:/m.test(t))return false;
  const i=t.search(/<!doctype html>|<html[\s>]/i);
  if(i<0)return false;
  return t.slice(0,i).replace(/```/g,"").trim().length<40;
}

/* ============ model ============ */
async function callModel(model,prompt,imgs,onTok){
  const history=[];
  for(const m of state.chat.filter(x=>x.role==="user"||(x.role==="assistant"&&!x.err&&!x.bundle)).slice(-6)){
    history.push({role:m.role,content:m.text||""});
  }
  history.pop();
  let userContent;
  if(imgs&&imgs.length){
    userContent=[{type:"text",text:prompt||"Describe this image."}];
    for(const d of imgs)userContent.push({type:"image_url",image_url:{url:d}});
  } else {
    userContent=prompt;
  }
  history.push({role:"user",content:userContent});
  const res=await fetch(API,{
    method:"POST",
    headers:{
      "Authorization":"Bearer "+state.key,
      "Content-Type":"application/json",
      "HTTP-Referer":location.origin,
      "X-Title":"Forge",
    },
    body:JSON.stringify({
      model,
      messages:[{role:"system",content:SYS},...history],
      temperature:0.6,
      max_tokens:16384,
      stream:true,
    }),
  });
  if(!res.ok){
    const t=await res.text();
    const e=new Error("HTTP "+res.status+" — "+t.slice(0,240));
    e.status=res.status;
    throw e;
  }
  const rd=res.body.getReader();
  const dec=new TextDecoder();
  let buf="";
  while(true){
    const {value,done}=await rd.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    const parts=buf.split("\n");
    buf=parts.pop();
    for(const p of parts){
      if(!p.startsWith("data: "))continue;
      const d=p.slice(6).trim();
      if(d==="[DONE]")continue;
      try{
        const j=JSON.parse(d);
        const tk=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
        if(tk)onTok(tk);
      }catch(_){}
    }
  }
}

/* ============ send ============ */
async function send(){
  if(state.busy)return;
  if(!state.key){openKey();return;}
  const input=$("#input");
  if(!input)return;
  const raw=input.value.trim();
  const imgs=state.images.slice();
  if(!raw&&!imgs.length)return;
  input.value="";
  input.style.height="auto";

  state.chat.push({role:"user",text:raw});
  addMsg("user",raw,false,imgs);
  state.images=[];
  renderAttached();

  const el=addBuilding();
  const bSub=el.querySelector("#bSub");
  state.busy=true;
  const sendBtn=$("#send");
  if(sendBtn)sendBtn.disabled=true;
  status(imgs.length?"reading image…":"thinking…",false);

  const chain=imgs.length?VISION_MODELS:MODELS;
  let acc="",winner=null,lastErr=null;
  for(const m of chain){
    try{
      status("try "+m.split("/").pop(),false);
      acc="";
      await callModel(m,raw,imgs,tk=>{acc+=tk;if(bSub)bSub.textContent=acc.length+" chars";});
      winner=m;
      break;
    }catch(e){
      lastErr=e;
      if(e.status===401)break;
    }
  }
  if(el.parentNode)el.parentNode.removeChild(el);

  if(!winner){
    const msg=lastErr?lastErr.message:"all models failed";
    addMsg("assistant","Couldn't reach a model.\n"+msg,true);
    state.chat.push({role:"assistant",text:"failed",err:true});
    status("failed",false);
    state.busy=false;
    if(sendBtn)sendBtn.disabled=false;
    return;
  }

  const bundle=parseBundle(acc);
  const wantProject=bundleWorthy(raw);

  if(bundle&&(wantProject||bundle.files.length>1)){
    state.bundle={files:bundle.files};
    addBundleCard(bundle.files);
    state.chat.push({role:"assistant",text:"[bundle]",bundle:true});
    status("ok · "+bundle.files.length+" files",true);
    setTimeout(()=>{try{downloadBundle();}catch(_){}},180);
  } else if(isSite(acc)){
    const html=extractHTML(acc);
    state.code=html;
    setPreview(html);
    const sum="Site ready · "+html.split("\n").length+" lines · "+(html.length/1024).toFixed(1)+" KB";
    addMsg("assistant",sum);
    state.chat.push({role:"assistant",text:sum});
    switchTab("preview");
    status("ok · "+winner.split("/").pop(),true);
  } else {
    const txt=acc.trim()||"(empty)";
    addMsg("assistant",txt);
    state.chat.push({role:"assistant",text:txt});
    status("ok · "+winner.split("/").pop(),true);
  }
  state.busy=false;
  if(sendBtn)sendBtn.disabled=false;
  input.focus();
}

/* ============ download ============ */
function downloadBundle(){
  if(!state.bundle||!state.bundle.files||!state.bundle.files.length){
    toast("no bundle ready");return;
  }
  const files=state.bundle.files;
  try{
    if(files.length===1){
      const f=files[0];
      const blob=new Blob([f.content],{type:"application/octet-stream"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=f.path.split("/").pop();
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(a.href),1500);
      toast("saved "+a.download);
    } else {
      const zip=makeZip(files);
      const a=document.createElement("a");
      a.href=URL.createObjectURL(zip);
      a.download="forge-project.zip";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(a.href),1500);
      toast("saved forge-project.zip");
    }
  }catch(e){toast("download failed");}
}

/* ============ misc ============ */
function renderAttached(){
  const c=$("#attached");if(!c)return;
  c.innerHTML="";
  if(!state.images.length){c.classList.remove("on");return;}
  c.classList.add("on");
  state.images.forEach((src,i)=>{
    const d=document.createElement("div");
    d.className="a";
    const im=document.createElement("img");
    im.src=src;
    const x=document.createElement("button");
    x.type="button";x.textContent="×";
    x.addEventListener("click",()=>{state.images.splice(i,1);renderAttached();});
    d.appendChild(im);d.appendChild(x);
    c.appendChild(d);
  });
}
function openPreview(){
  if(!state.code)return toast("nothing to open");
  const w=window.open("","_blank");
  if(!w){toast("popup blocked");return;}
  w.document.write(state.code);w.document.close();
}
function switchTab(t){
  const main=$("#main");if(!main)return;
  main.classList.toggle("show-preview",t==="preview");
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab===t));
}
function openKey(){
  const m=$("#modal"),i=$("#keyInput");if(!m)return;
  if(i)i.value=state.key;
  m.classList.add("open");
  setTimeout(()=>i&&i.focus(),80);
}
function closeKey(){const m=$("#modal");if(m)m.classList.remove("open");}

/* ============ wire ============ */
function bind(id,fn){const el=document.getElementById(id);if(el)el.addEventListener("click",fn);}

bind("send",send);
bind("btnKey",openKey);
bind("btnNew",()=>{
  if(state.busy)return;
  if(!confirm("Start fresh?"))return;
  state.chat=[];state.code="";state.bundle=null;state.images=[];
  const log=$("#log");if(log)log.innerHTML="";
  showEmpty();
  setPreview("");
  renderAttached();
  status(state.key?"ready":"tap key",false);
  switchTab("chat");
});
bind("keyCancel",closeKey);
bind("keySave",()=>{
  const i=$("#keyInput");
  state.key=i?i.value.trim():"";
  closeKey();
  status(state.key?"ready":"tap key",false);
  toast(state.key?"key saved":"key cleared");
});
bind("btnOpen",openPreview);
bind("btnDl",()=>downloadBundle());

const input=$("#input");
if(input){
  input.addEventListener("input",()=>{
    input.style.height="auto";
    input.style.height=Math.min(input.scrollHeight,140)+"px";
  });
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>900){e.preventDefault();send();}
  });
  input.addEventListener("paste",async e=>{
    const items=e.clipboardData&&e.clipboardData.items;
    if(!items)return;
    for(const it of items){
      if(it.type&&it.type.indexOf("image/")===0){
        const file=it.getAsFile();
        if(!file)continue;
        const data=await new Promise((res,rej)=>{
          const r=new FileReader();
          r.onload=()=>res(r.result);
          r.onerror=rej;
          r.readAsDataURL(file);
        });
        state.images.push(data);
        renderAttached();
      }
    }
  });
}

const fileInput=$("#file");
if(fileInput){
  fileInput.addEventListener("change",async e=>{
    const files=[].slice.call(e.target.files||[]).slice(0,4);
    for(const file of files){
      const data=await new Promise((res,rej)=>{
        const r=new FileReader();
        r.onload=()=>res(r.result);
        r.onerror=rej;
        r.readAsDataURL(file);
      });
      state.images.push(data);
    }
    renderAttached();
    fileInput.value="";
  });
}

[].slice.call(document.querySelectorAll(".tab")).forEach(x=>{
  x.addEventListener("click",()=>switchTab(x.dataset.tab));
});

const modal=$("#modal");
if(modal){
  modal.addEventListener("click",e=>{if(e.target===modal)closeKey();});
}

/* boot */
showEmpty();
status("tap key",false);
setTimeout(()=>{
  status(state.key?"ready":"tap key",false);
},50);

}catch(err){
  fatal(err&&err.message?err.message:String(err));
}

})();
</script>
